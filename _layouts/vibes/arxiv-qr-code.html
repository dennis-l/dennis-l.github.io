<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>arXiv QR Code Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #faf9f7;
    --text: #1a1a1a;
    --muted: #888;
    --border: #ddd;
    --accent: #b31b1b;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .container {
    width: 100%;
    max-width: 480px;
  }

  header {
    margin-bottom: 2.5rem;
    text-align: center;
  }

  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.4rem;
  }

  .arxiv-badge {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 1.5rem;
    color: var(--accent);
  }

  h1 {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.8rem;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2rem;
  }

  label {
    display: block;
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .input-row {
    display: flex;
    gap: 0.5rem;
  }

  input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.9rem;
    font-weight: 300;
    padding: 0.65rem 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus {
    border-color: #aaa;
  }

  input[type="text"]::placeholder {
    color: #bbb;
  }

  button {
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: #fff;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.65rem 1.2rem;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  button:hover { opacity: 0.85; }

  .error {
    font-size: 0.78rem;
    color: var(--accent);
    margin-top: 0.5rem;
    min-height: 1rem;
  }

  .output {
    margin-top: 2rem;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  .output.visible { display: flex; }

  .qr-wrapper {
    position: relative;
    display: inline-block;
    line-height: 0;
  }

  #qrcode canvas, #qrcode img {
    display: block;
    width: 300px !important;
    height: 300px !important;
    border-radius: 6px;
  }

  .qr-center-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -46%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .qr-logo {
    width: 68px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .qr-logo svg {
    width: 100%;
    height: 100%;
  }

  .paper-id {
    font-size: 1.08rem;
    font-family: 'Jost', sans-serif;
    color: #777;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .dl-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--muted);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.8rem;
    font-weight: 400;
    padding: 0.5rem 1.4rem;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }

  .toggle-label {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }

  .toggle-label input {
    accent-color: var(--accent);
    cursor: pointer;
  }

  .dl-rows {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    width: 100%;
  }

  .dl-row {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
  }

  .dl-row .dl-btn {
    flex: 1;
  }

  .dl-btn:hover {
    border-color: #aaa;
    color: var(--text);
    background: transparent;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-row">
      <div class="arxiv-badge">arXiv</div>
    </div>
    <h1>QR code generator</h1>
  </header>

  <div class="card">

    <label>arXiv URL or Paper ID</label>
    <div class="input-row">
      <input type="text" id="arxivInput" placeholder="arxiv.org/abs/2301.00001 or 2301.00001" />
      <button onclick="generate()">Generate</button>
    </div>
    <div class="error" id="error"></div>

    <div class="output" id="output">
      <div class="qr-wrapper">
        <div id="qrcode"></div>
        <div class="qr-center-overlay">
          <div class="qr-logo">
          <svg id="primary_logo" data-name="primary logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246.978 111.119"><path d="M427.571,255.154c1.859,0,3.1,1.24,3.985,3.453,1.062-2.213,2.568-3.453,4.694-3.453h14.878a4.062,4.062,0,0,1,4.074,4.074v7.828c0,2.656-1.327,4.074-4.074,4.074-2.656,0-4.074-1.418-4.074-4.074V263.3H436.515a2.411,2.411,0,0,0-2.656,2.745v27.188h10.007c2.658,0,4.074,1.329,4.074,4.074s-1.416,4.074-4.074,4.074h-26.39c-2.659,0-3.986-1.328-3.986-4.074s1.327-4.074,3.986-4.074h8.236V263.3h-7.263c-2.656,0-3.985-1.329-3.985-4.074,0-2.658,1.329-4.074,3.985-4.074Z" transform="translate(-358.165 -222.27)" fill="#7c7469"/><path d="M539.233,255.154c2.656,0,4.074,1.416,4.074,4.074v34.007h10.1c2.746,0,4.074,1.329,4.074,4.074s-1.328,4.074-4.074,4.074H524.8c-2.656,0-4.074-1.328-4.074-4.074s1.418-4.074,4.074-4.074h10.362V263.3h-8.533c-2.744,0-4.073-1.329-4.073-4.074,0-2.658,1.329-4.074,4.073-4.074Zm4.22-17.615a5.859,5.859,0,1,1-5.819-5.819A5.9,5.9,0,0,1,543.453,237.539Z" transform="translate(-358.165 -222.27)" fill="#7c7469"/><path d="M605.143,259.228a4.589,4.589,0,0,1-.267,1.594L590,298.9a3.722,3.722,0,0,1-3.721,2.48h-5.933a3.689,3.689,0,0,1-3.808-2.48l-15.055-38.081a3.23,3.23,0,0,1-.355-1.594,4.084,4.084,0,0,1,4.164-4.074,3.8,3.8,0,0,1,3.718,2.656l14.348,36.134,13.9-36.134a3.8,3.8,0,0,1,3.72-2.656A4.084,4.084,0,0,1,605.143,259.228Z" transform="translate(-358.165 -222.27)" fill="#7c7469"/><path d="M486.149,277.877l-32.741,38.852c-1.286,1.372-2.084,3.777-1.365,5.5a4.705,4.705,0,0,0,4.4,2.914,4.191,4.191,0,0,0,3.16-1.563l40.191-42.714a4.417,4.417,0,0,0,.042-6.042Z" transform="translate(-358.165 -222.27)" fill="#aa142d"/><path d="M486.149,277.877l31.187-38.268c1.492-1.989,2.2-3.03,1.492-4.723a5.142,5.142,0,0,0-4.481-3.161h0a4.024,4.024,0,0,0-3.008,1.108L472.711,274.6a4.769,4.769,0,0,0,.015,6.53L520.512,332.2a3.913,3.913,0,0,0,3.137,1.192,4.394,4.394,0,0,0,4.027-2.818c.719-1.727-.076-3.438-1.4-5.23l-40.124-47.464" transform="translate(-358.165 -222.27)" fill="#7c7469"/><path d="M499.833,274.828,453.169,224.4s-1.713-2.08-3.524-2.124a4.607,4.607,0,0,0-4.338,2.788c-.705,1.692-.2,2.88,1.349,5.1l40.093,48.422" transform="translate(-358.165 -222.27)" fill="#aa142d"/><path d="M390.61,255.154c5.018,0,8.206,3.312,8.206,8.4v37.831H363.308a4.813,4.813,0,0,1-5.143-4.929V283.427a8.256,8.256,0,0,1,7-8.148l25.507-3.572v-8.4H362.306a4.014,4.014,0,0,1-4.141-4.074c0-2.87,2.143-4.074,4.355-4.074Zm.059,38.081V279.942l-24.354,3.4v9.9Z" transform="translate(-358.165 -222.27)" fill="#7c7469"/></svg>
          </div>
          <div class="paper-id" id="paperId"></div>
        </div>
      </div>
      <label class="toggle-label">
        <input type="checkbox" id="showId" checked onchange="toggleId()"> Include arXiv ID
      </label>
      <div class="dl-rows">
        <div class="dl-row">
          <button class="dl-btn" onclick="download()">↓ PNG</button>
          <button class="dl-btn" onclick="downloadPoster()">↓ Poster (4096px)</button>
        </div>
        <div class="dl-row">
          <button class="dl-btn" onclick="downloadTransparent()">↓ PNG (transparent)</button>
          <button class="dl-btn" onclick="downloadPosterTransparent()">↓ Poster (transparent)</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const CANVAS_SIZE = 1024;
const RADIUS_RATIO = 0.45; // roundness of each module (0 = square, 0.5 = circle)
const DARK = '#0d0d0d';
const LIGHT = '#ffffff';

function parseArxiv(input) {
  input = input.trim();
  const absMatch = input.match(/arxiv\.org\/abs\/([\d.v]+)/i);
  if (absMatch) return 'https://arxiv.org/abs/' + absMatch[1];
  const pdfMatch = input.match(/arxiv\.org\/pdf\/([\d.v]+)/i);
  if (pdfMatch) return 'https://arxiv.org/abs/' + pdfMatch[1];
  const bareId = input.match(/^(\d{4}\.\d{4,5}(v\d+)?)$/);
  if (bareId) return 'https://arxiv.org/abs/' + bareId[1];
  const oldId = input.match(/^([a-z\-]+\/\d{7}(v\d+)?)$/i);
  if (oldId) return 'https://arxiv.org/abs/' + oldId[1];
  return null;
}

// Draw a rounded rectangle path
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Draw a finder pattern (the big corner squares) with rounded outer ring
function drawFinder(ctx, x, y, moduleSize, transparent = false) {
  const s = moduleSize;
  const r = s * 0.35;
  // Outer 7x7 dark
  roundRect(ctx, x, y, 7*s, 7*s, r * 2);
  ctx.fillStyle = DARK;
  ctx.fill();
  // Inner 5x5: white on opaque, clear on transparent
  roundRect(ctx, x + s, y + s, 5*s, 5*s, r * 1.5);
  if (transparent) {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.fill();
    ctx.restore();
  } else {
    ctx.fillStyle = LIGHT;
    ctx.fill();
  }
  // Center 3x3 dark
  roundRect(ctx, x + 2*s, y + 2*s, 3*s, 3*s, r);
  ctx.fillStyle = DARK;
  ctx.fill();
}

// Logo zone constants (must match download fn)
const LOGO_W_FRAC = 0.30;
const LOGO_ASPECT = 111.119 / 246.978;
const LOGO_PAD_FRAC = 0.025;
// Extra vertical space below logo for the paper ID text (~16px on 1024px canvas)
const LOGO_EXTRA_BOTTOM = 0.055;

function logoZone(size, showId = true) {
  const logoW = size * LOGO_W_FRAC;
  const logoH = logoW * LOGO_ASPECT;
  const pad = size * LOGO_PAD_FRAC;
  const extraB = showId ? size * LOGO_EXTRA_BOTTOM : 0;
  const cy = size / 2 - (logoH + extraB) * (showId ? 0.08 : 0);
  return {
    x: (size - logoW) / 2 - pad,
    y: cy - logoH / 2 - pad,
    w: logoW + pad * 2,
    h: logoH + extraB + pad * 2
  };
}

function drawRoundedQR(canvas, qr, transparent = false, showId = true) {
  const ctx = canvas.getContext('2d');
  const count = qr.getModuleCount();
  const size = canvas.width;
  const padding = size * 0.04;
  const available = size - padding * 2;
  const moduleSize = available / count;
  const r = moduleSize * RADIUS_RATIO;
  const zone = logoZone(size, showId);

  // Background
  if (!transparent) {
    ctx.fillStyle = LIGHT;
    ctx.fillRect(0, 0, size, size);
  } else {
    ctx.clearRect(0, 0, size, size);
  }

  const finderPositions = [[0,0],[count-7,0],[0,count-7]];

  function isFinder(row, col) {
    return finderPositions.some(([fc, fr]) =>
      col >= fc && col < fc + 7 && row >= fr && row < fr + 7
    );
  }

  function inLogoZone(row, col) {
    const mx = padding + col * moduleSize;
    const my = padding + row * moduleSize;
    return mx + moduleSize > zone.x && mx < zone.x + zone.w &&
           my + moduleSize > zone.y && my < zone.y + zone.h;
  }

  // Draw data modules (skip finder zones and logo zone)
  ctx.fillStyle = DARK;
  for (let row = 0; row < count; row++) {
    for (let col = 0; col < count; col++) {
      if (isFinder(row, col)) continue;
      if (inLogoZone(row, col)) continue;
      if (qr.isDark(row, col)) {
        const x = padding + col * moduleSize;
        const y = padding + row * moduleSize;
        roundRect(ctx, x + 0.5, y + 0.5, moduleSize - 1, moduleSize - 1, r);
        ctx.fill();
      }
    }
  }

  // Draw finder patterns
  finderPositions.forEach(([fc, fr]) => {
    drawFinder(ctx, padding + fc * moduleSize, padding + fr * moduleSize, moduleSize, transparent);
  });
}

function buildCanvas() {
  const existing = document.querySelector('#qrcode canvas');
  if (existing) return existing;
  const c = document.createElement('canvas');
  c.width = CANVAS_SIZE;
  c.height = CANVAS_SIZE;
  document.getElementById('qrcode').appendChild(c);
  return c;
}

function generate() {
  const input = document.getElementById('arxivInput').value;
  const errorEl = document.getElementById('error');
  const output = document.getElementById('output');

  errorEl.textContent = '';
  const url = parseArxiv(input);
  if (!url) {
    errorEl.textContent = 'Invalid arXiv URL or ID.';
    output.classList.remove('visible');
    return;
  }

  const idMatch = url.match(/abs\/(.+)/); document.getElementById('paperId').textContent = idMatch ? idMatch[1] : url;
  document.getElementById('qrcode').innerHTML = '';

  const qr = qrcode(0, 'H');
  qr.addData(url);
  qr.make();

  window._lastQR = qr;
  const canvas = buildCanvas();
  const showId = document.getElementById('showId').checked;
  drawRoundedQR(canvas, qr, false, showId);
  output.classList.add('visible');
}

function exportQR(targetSize, filename, transparent = false) {
  const showId = document.getElementById('showId').checked;
  const sourceCanvas = document.querySelector('#qrcode canvas');
  if (!sourceCanvas) return;

  const qrData = window._lastQR;
  if (!qrData) return;

  const hiCanvas = document.createElement('canvas');
  hiCanvas.width = targetSize;
  hiCanvas.height = targetSize;
  drawRoundedQR(hiCanvas, qrData, transparent, showId);

  const zone = logoZone(targetSize, showId);
  const logoW = Math.round(targetSize * LOGO_W_FRAC);
  const logoH = Math.round(logoW * LOGO_ASPECT);
  const lx = zone.x + (zone.w - logoW) / 2;
  const ly = zone.y + (zone.h - logoH) / 2;

  const svgEl = document.querySelector('.qr-logo svg');
  const svgData = new XMLSerializer().serializeToString(svgEl);
  const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
  const svgUrl = URL.createObjectURL(svgBlob);

  const img = new Image();
  img.onload = () => {
    const ctx = hiCanvas.getContext('2d');
    ctx.drawImage(img, lx, ly, logoW, logoH);

    // Draw paper ID text onto canvas in transparent mode (HTML overlay invisible)
    if (transparent && showId) {
      const paperIdEl = document.getElementById('paperId');
      const idText = paperIdEl.textContent;
      if (idText) {
        const fontSize = Math.round(targetSize * 0.038);
        ctx.font = `400 ${fontSize}px Jost, sans-serif`;
        ctx.fillStyle = '#777777';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        const textY = ly + logoH + Math.round(targetSize * 0.012);
        ctx.fillText(idText, targetSize / 2, textY);
      }
    }

    URL.revokeObjectURL(svgUrl);
    const a = document.createElement('a');
    a.download = filename;
    a.href = hiCanvas.toDataURL('image/png');
    a.click();
  };
  img.src = svgUrl;
}

function download() { exportQR(1024, 'arxiv-qr.png'); }
function downloadPoster() { exportQR(4096, 'arxiv-qr-poster.png'); }
function downloadTransparent() { exportQR(1024, 'arxiv-qr-transparent.png', true); }
function downloadPosterTransparent() { exportQR(4096, 'arxiv-qr-poster-transparent.png', true); }

function toggleId() {
  const show = document.getElementById('showId').checked;
  document.getElementById('paperId').style.visibility = show ? 'visible' : 'hidden';
  if (window._lastQR) {
    const canvas = document.querySelector('#qrcode canvas');
    if (canvas) drawRoundedQR(canvas, window._lastQR, false, show);
  }
}

document.getElementById('arxivInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') generate();
});
</script>
</body>
</html>
