*d,n+2*d,3*d,3*d,a),e.fillStyle=DARK,e.fill()}function logoZone(e,t=!0){const n=e*LOGO_W_FRAC,o=n*LOGO_ASPECT,r=e*LOGO_PAD_FRAC,d=t?e*LOGO_EXTRA_BOTTOM:0;return{x:(e-n)/2-r,y:e/2-(o+d)*(t?.08:0)-o/2-r,w:n+2*r,h:o+d+2*r}}function drawRoundedQR(e,t,n=!1,o=!0){function r(e,t){return m.some(([n,o])=>t>=n&&t<n+7&&e>=o&&e<o+7)}function d(e,t){const n=l+t*s,o=l+e*s;return n+s>f.x&&n<f.x+f.w&&o+s>f.y&&o<f.y+f.h}const a=e.getContext("2d"),i=t.getModuleCount(),c=e.width,l=.04*c,s=(c-2*l)/i,u=s*RADIUS_RATIO,f=logoZone(c,o);n?a.clearRect(0,0,c,c):(a.fillStyle=LIGHT,a.fillRect(0,0,c,c));const m=[[0,0],[i-7,0],[0,i-7]];a.fillStyle=DARK;for(let e=0;e<i;e++)for(let n=0;n<i;n++)if(!r(e,n)&&!d(e,n)&&t.isDark(e,n)){roundRect(a,l+n*s+.5,l+e*s+.5,s-1,s-1,u),a.fill()}m.forEach(([e,t])=>{drawFinder(a,l+e*s,l+t*s,s,n)})}function buildCanvas(){const e=document.querySelector("#qrcode canvas");if(e)return e;const t=document.createElement("canvas");return t.width=CANVAS_SIZE,t.height=CANVAS_SIZE,document.getElementById("qrcode").appendChild(t),t}function generate(){const e=document.getElementById("arxivInput").value,t=document.getElementById("error"),n=document.getElementById("output");t.textContent="";const o=parseArxiv(e);if(!o)return t.textContent="Invalid arXiv URL or ID.",void n.classList.remove("visible");const r=o.match(/abs\/(.+)/);document.getElementById("paperId").textContent=r?r[1]:o,document.getElementById("qrcode").innerHTML="";const d=qrcode(0,"H");d.addData(o),d.make(),window._lastQR=d;drawRoundedQR(buildCanvas(),d,!1,document.getElementById("showId").checked),n.classList.add("visible")}function exportQR(e,t,n=!1){const o=document.getElementById("showId").checked;if(!document.querySelector("#qrcode canvas"))return;const r=window._lastQR;if(!r)return;const d=document.createElement("canvas");d.width=e,d.height=e,drawRoundedQR(d,r,n,o);const a=logoZone(e,o),i=Math.round(e*LOGO_W_FRAC),c=Math.round(i*LOGO_ASPECT),l=a.x+(a.w-i)/2,s=a.y+(a.h-c)/2,u=document.querySelector(".qr-logo svg
